[workspace]
resolver = "3"
members = [
  "crates/inspect-model",
  "crates/inspect-sim",
  "crates/inspect-server",
  "apps/inspect",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mpecan/allium-inspect"
rust-version = "1.96"

[workspace.dependencies]
# --- workspace crates ---
inspect-model = { path = "crates/inspect-model" }
inspect-sim = { path = "crates/inspect-sim" }
inspect-server = { path = "crates/inspect-server" }

# --- serialisation ---
# The whole tool is a pipeline of JSON documents: four `allium` subcommand
# outputs in, one SpecGraph out, simulator state over the wire both ways.
serde = { version = "1", features = ["derive"] }
# `preserve_order` is deliberate. The AST is walked with `serde_json::Value`
# before it is typed, and a HashMap-backed object would make graph output
# depend on hash iteration order — the one thing snapshot tests cannot tolerate.
serde_json = { version = "1", features = ["preserve_order"] }
# Generates ui/src/lib/api/types.ts from the Rust structs, so the wire contract
# cannot drift. Rent: crates/inspect-model/src/graph.rs, inspect-sim/src/lib.rs.
ts-rs = "12"

# --- errors ---
# Typed errors on library boundaries. Rent: inspect-model/src/runner.rs.
thiserror = "2"

# --- HTTP ---
# The embedded server. Rent: crates/inspect-server/src/router.rs.
axum = "0.8"
# Compression and tracing layers for the asset route. Rent: inspect-server.
tower-http = { version = "0.7", features = ["compression-gzip", "trace"] }
# Handler tests without a socket (`ServiceExt::oneshot`). Rent: server tests.
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
# Bakes the built UI into the binary, so `allium-inspect` is one file with no
# asset path to resolve. Rent: crates/inspect-server/src/assets.rs.
rust-embed = { version = "8", features = ["mime-guess"] }

# --- binary ---
# Argument parsing. Rent: apps/inspect/src/args.rs.
clap = { version = "4", features = ["derive"] }
# Opens the browser at the bound port. Rent: apps/inspect/src/main.rs.
open = "5"
# Watches the spec files and pushes a reload over SSE. Rent: apps/inspect.
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- test-only ---
# Determinism and invariant properties of the simulator. Rent: inspect-sim tests.
proptest = "1"
# Snapshot tests of SpecGraph and StepOutcome. Rent: model + sim tests.
insta = { version = "1", features = ["json", "redactions"] }

[profile.release]
# One binary that people download and run; size matters more than the last few
# percent of throughput on a graph of a few hundred nodes.
lto = "thin"
strip = true
