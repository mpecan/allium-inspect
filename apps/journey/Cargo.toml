[package]
name = "allium-journey"
description = "Walk user journeys against an Allium specification"
readme = "../../README.md"
keywords = ["allium", "specification", "journeys", "testing"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "allium-journey"
path = "src/main.rs"

# `cargo binstall` fetches the prebuilt archive the release workflow attaches to
# the GitHub release instead of compiling. One archive per target holds both
# binaries, so this and the other app crate point at the same file.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/allium-inspect-v{ version }/allium-inspect-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
inspect-journey = { workspace = true }
inspect-model = { workspace = true }
inspect-sim = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
