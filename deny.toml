# cargo-deny configuration for allium-inspect.
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Permissive only. MPL-2.0 was allowed here and used by nothing — a standing
# permission for weak copyleft that no dependency had asked for, which is the
# kind of allowance that is only noticed once something arrives under it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
# Versionless path deps between workspace crates trip the wildcard check;
# registry wildcards are still caught.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git sources at all. `allium-parser` came from its git tag until the crates
# were published, and a crate with a git dependency cannot be; it comes from
# crates.io now, pinned exactly to the version the fixtures were recorded from.
