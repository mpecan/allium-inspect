[package]
name = "inspect-server"
description = "Embedded HTTP server exposing the SpecGraph and simulator to the browser UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
inspect-model = { workspace = true }
inspect-sim = { workspace = true }
axum = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
# ts-rs: generates the TypeScript for /api/health, so the browser's idea of
# the reload signal cannot drift from the server's.
ts-rs.workspace = true
tracing = { workspace = true }

[dev-dependencies]
http = "1"
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }
