[package]
name = "allium-inspect-model"
description = "Ingests the allium CLI's JSON output into a linked, projectable SpecGraph. Part of allium-inspect, published so the `allium-inspect` and `allium-journey` binaries can be installed from crates.io; not a stable API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The Rust name the rest of the workspace imports it by. The package is
# prefixed because the unprefixed name is too general to claim on crates.io.
[lib]
name = "inspect_model"

[dependencies]
# allium-parser: allium's own parser, so parse and analyse are function calls
# rather than a subprocess and a JSON round trip. An upstream shape change is
# then a compile error instead of a fixture that silently misparses.
allium-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
