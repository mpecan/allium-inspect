[package]
name = "allium-inspect-journey"
description = "Journeys written against an Allium spec: parsed, checked and walked. Part of allium-inspect, published so the `allium-inspect` and `allium-journey` binaries can be installed from crates.io; not a stable API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The Rust name the rest of the workspace imports it by. The package is
# prefixed because the unprefixed name is too general to claim on crates.io.
[lib]
name = "inspect_journey"

[dependencies]
# allium-parser: a surface's `exposes` clause is walked to answer whether it
# shows a particular thing to a particular person, and that is a question about
# a collection and a filter rather than about a string.
allium-parser = { workspace = true }
inspect-model = { workspace = true }
inspect-sim = { workspace = true }
serde = { workspace = true }
# The world and the step outcome cross the wire as JSON, and a journey report
# is asked for as JSON by the agents that write journeys.
serde_json = { workspace = true }
# Generates the TypeScript for a journey report, so the browser's idea of a
# verdict cannot drift from this crate's.
ts-rs = { workspace = true }
